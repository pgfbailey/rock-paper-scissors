<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>Rock Paper Scissors</h1>
        </header>

        <div class="score-board">
            <div class="badge" id="user-label">YOU</div>
            <div class="badge" id="cpu-label">CPU</div>
            <span id="user-score">0</span>:<span id="cpu-score">0</span>
        </div>

        <div class="result">
            <p>Paper covers rock. You win!</p>
        </div>

        <div class="choices">
            <div class="choice" id="r">
                <img src="img/rock.png" alt="Rock">
            </div>
            <div class="choice" id="p">
                <img src="img/paper.png" alt="Paper">
            </div>
            <div class="choice" id="s">
                <img src="img/scissors.png" alt="Scissors">
            </div>
        </div>
        <p id="action-message">Choose your weapon.</p>
        <script src="app.js" charset="utf-8"></script>
    </body>
</html>
